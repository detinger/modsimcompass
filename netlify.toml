# Netlify — static build of ModSim Essentials (no functions, no backend).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Missing hashed assets return a real 404 instead of the SPA shell.
[[redirects]]
  from = "/assets/*"
  to = "/not-found.txt"
  status = 404

# SPA fallback: deep links such as /challenges/C04 survive refresh.
# Existing files (index.html, assets, favicon) are served first because force = false.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
