<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ModSimCompass — a project compass for modelling and simulation: frame the question, set the scope, choose a method, plan the checks and share a project report." />
    <meta name="application-name" content="ModSimCompass" />
    <meta name="theme-color" content="#1f5f8b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)" />
    <title>ModSimCompass</title>
    <script>
      // Resolve the stored theme before first paint (STYLE §2.1). System preference applies when unset.
      try {
        var p = JSON.parse(localStorage.getItem('modsim101.prefs') || '{}');
        if (p.theme === 'light' || p.theme === 'dark') document.documentElement.setAttribute('data-theme', p.theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ModSimCompass needs JavaScript to run. All data stays in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
